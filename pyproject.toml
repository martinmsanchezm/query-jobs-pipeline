[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "query-jobs-pipeline"
version = "0.1.0"
description = "Batch data pipeline for remote Data Engineer job postings: ingest, validate, deduplicate, load incrementally into DuckDB, and enrich."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Martin Sanchez" }]
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "httpx>=0.27"]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
